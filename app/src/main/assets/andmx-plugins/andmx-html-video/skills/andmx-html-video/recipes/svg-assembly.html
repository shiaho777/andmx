<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>__TITLE__</title>
<style>
  :root{--bg:__BG__;--accent:__ACCENT__;--fg:#f4f6f8}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--fg);font-family:ui-sans-serif,system-ui,sans-serif}
  #stage{width:min(100vw,calc(100vh * __VIDEO_WIDTH__ / __VIDEO_HEIGHT__));aspect-ratio:__VIDEO_WIDTH__/__VIDEO_HEIGHT__;margin:0 auto;background:var(--bg);display:grid;place-items:center;position:relative}
  svg{width:70%;height:auto;overflow:visible}
  h1{position:absolute;top:10%;left:0;right:0;text-align:center;font-size:clamp(18px,4vw,32px);letter-spacing:.08em;opacity:.85}
</style>
</head>
<body>
<div id="stage">
  <h1>__LABEL__</h1>
  <svg viewBox="0 0 240 240" aria-label="assembly">
    <g id="parts">
      <path id="p0" d="M40 40h70v70H40z" fill="__ACCENT__"/>
      <path id="p1" d="M130 40h70v70h-70z" fill="#94a3b8"/>
      <path id="p2" d="M40 130h70v70H40z" fill="#64748b"/>
      <path id="p3" d="M130 130h70v70h-70z" fill="#cbd5e1"/>
      <circle id="p4" cx="120" cy="120" r="18" fill="#0b0d10" stroke="__ACCENT__" stroke-width="4"/>
    </g>
  </svg>
</div>
<script>
(() => {
  const D = +("__DURATION_MS__") || 10000;
  const ids = ["p0","p1","p2","p3","p4"];
  const from = [[-120,-90],[140,-100],[-110,130],[150,140],[0,-160]];
  const t0 = performance.now();
  function easeOutBack(x){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}
  function getStateAtTime(t){
    const p = Math.min(1, Math.max(0, (t - D*0.08)/(D*0.55)));
    const e = easeOutBack(p);
    const settle = Math.min(1, Math.max(0, (t - D*0.65)/(D*0.2)));
    return {e, settle, progress: Math.min(1,t/D)};
  }
  function apply(s){
    ids.forEach((id,i)=>{
      const el = document.getElementById(id);
      const x = from[i][0]*(1-s.e);
      const y = from[i][1]*(1-s.e);
      const rot = (1-s.e)* (i%2?28:-28);
      const sc = 0.4 + 0.6*s.e;
      el.setAttribute("transform", `translate(${x} ${y}) rotate(${rot} 120 120) scale(${sc})`);
      el.style.opacity = 0.25 + 0.75*s.e;
    });
  }
  function frame(now){
    const t=Math.min(D,now-t0);
    apply(getStateAtTime(t));
    if (t<D) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
