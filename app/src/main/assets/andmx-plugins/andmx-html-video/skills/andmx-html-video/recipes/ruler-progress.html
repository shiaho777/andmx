<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>__TITLE__</title>
<style>
  :root{--bg:__BG__;--accent:__ACCENT__;--fg:#f4f6f8;--muted:#9aa3ad}
  html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:ui-sans-serif,system-ui,sans-serif;overflow:hidden}
  #stage{width:min(100vw,calc(100vh * __VIDEO_WIDTH__ / __VIDEO_HEIGHT__));aspect-ratio:__VIDEO_WIDTH__/__VIDEO_HEIGHT__;margin:0 auto;background:var(--bg);display:grid;place-items:center;position:relative}
  .box{width:82%}
  h1{margin:0 0 1.4rem;font-size:clamp(22px,5vw,40px);text-align:center;letter-spacing:.04em}
  .track{position:relative;height:22px;border-radius:999px;background:#ffffff14;overflow:hidden}
  .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--accent),#a5f3fc)}
  .ticks{display:flex;justify-content:space-between;margin-top:10px}
  .ticks i{width:2px;height:10px;background:#ffffff33;display:block}
  #pct{margin-top:1.2rem;text-align:center;font-size:clamp(36px,8vw,64px);font-variant-numeric:tabular-nums}
  #label{text-align:center;color:var(--muted);margin-top:.6rem}
</style>
</head>
<body>
<div id="stage">
  <div class="box">
    <h1>__LABEL__</h1>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="ticks" id="ticks"></div>
    <div id="pct">0%</div>
    <div id="label">progress phase</div>
  </div>
</div>
<script>
(() => {
  const D = +("__DURATION_MS__") || 10000;
  const ticks = document.getElementById("ticks");
  for (let i=0;i<21;i++){const el=document.createElement("i");ticks.appendChild(el);}
  const t0 = performance.now();
  const timeline = [
    {name:"anticipation", duration:D*0.1},
    {name:"travel", duration:D*0.7},
    {name:"settle", duration:D*0.2},
  ];
  function getPhase(t){
    let acc=0;
    for (const s of timeline){
      if (t < acc+s.duration) return {name:s.name, t:s.duration?(t-acc)/s.duration:1};
      acc+=s.duration;
    }
    return {name:"settle", t:1};
  }
  function easeInOut(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}
  function getStateAtTime(t){
    const phase = getPhase(t);
    let p = 0;
    if (phase.name==="travel") p = easeInOut(phase.t);
    if (phase.name==="settle") p = 1;
    return {phase, p, progress:Math.min(1,t/D)};
  }
  function apply(s){
    document.getElementById("fill").style.width = (s.p*100).toFixed(2)+"%";
    document.getElementById("pct").textContent = Math.round(s.p*100)+"%";
    document.getElementById("label").textContent = s.phase.name;
  }
  function frame(now){
    const t=Math.min(D,now-t0);
    apply(getStateAtTime(t));
    if (t<D) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
