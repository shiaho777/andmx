# Delivery gate:
# - Branch protection should require this workflow's merge job on PRs into main.
# - Issues close via PR body Fixes #N / Closes #N on *merge*, not from this workflow.
# - Do not merge while this workflow is red; do not close the linked Issue early.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install Alpine image build dependencies
        run: python -m pip install -r linux-runtime/tools/requirements.txt

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action default includes the removed `tools` package, which
          # fails sdkmanager; platform-tools is all we need preinstalled here.
          packages: platform-tools

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install platform and build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Gradle compile debug
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Build native (CMake/NDK)
        run: ./gradlew :app:externalNativeBuildDebug --no-daemon --stacktrace

      - name: Assemble unsigned AndMX release
        run: ./gradlew :app:assembleRelease -PandmxGithubRelease=true --no-daemon --stacktrace

      - name: Verify the embedded Linux runtime
        run: |
          python - <<'PY'
          from zipfile import ZipFile

          with ZipFile('app/build/outputs/apk/release/app-release-unsigned.apk') as apk:
              files = set(apk.namelist())
              assert 'lib/arm64-v8a/liblinux_runtime.so' in files
              assert 'lib/arm64-v8a/libqemu-system-aarch64.so' in files
              assert 'assets/linux-runtime/vmlinuz' in files
              assert 'assets/linux-runtime/initramfs' in files
              assert not any('libproot' in name or 'libtalloc' in name for name in files)
          PY

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compile instrumented smoke tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PtestAbi=x86_64 --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Offline Android UI smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest -PtestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.andmx.SmokeTest,com.andmx.DynamicWorkflowRunnerTest --no-daemon --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Delivery policy summary
        if: always()
        run: |
          {
            echo "## Delivery gate"
            echo "- Job: \`build\` (workflow **CI**)"
            echo "- Verifies: Kotlin · bundled ARM64 Alpine · native (CMake/NDK) · unit/Robolectric tests · x86_64 Android smoke tests"
            echo "- Merge only when this job is green on PRs into \`main\`."
            echo "- Issues close via PR body \`Fixes #N\` / \`Closes #N\` on **merge**, not from CI."
            echo "- Do not close the linked Issue while CI is red or only because the PR opened."
          } >> "$GITHUB_STEP_SUMMARY"
