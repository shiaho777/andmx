# Delivery gate:
# - Branch protection should require this workflow's merge job on PRs into main.
# - Issues close via PR body Fixes #N / Closes #N on *merge*, not from this workflow.
# - Do not merge while this workflow is red; do not close the linked Issue early.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action default includes the removed `tools` package, which
          # fails sdkmanager; platform-tools is all we need preinstalled here.
          packages: platform-tools

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install platform and build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Gradle compile liteDebug
        run: ./gradlew :app:compileLiteDebugKotlin --no-daemon --stacktrace

      # The proot flavor drops targetSdk to 28 so guest binaries stay exec-able.
      # It compiles from the same sources but is a separate variant, so a
      # lite-only gate can go green while this one is broken.
      - name: Gradle compile prootDebug
        run: ./gradlew :app:compileProotDebugKotlin --no-daemon --stacktrace

      # pty.c backs PersistentShell and TerminalSession. Kotlin compilation
      # never touches it, so without this step C breakage ships unnoticed.
      - name: Build native (CMake/NDK)
        run: ./gradlew :app:externalNativeBuildLiteDebug --no-daemon --stacktrace

      - name: Assemble unsigned Lite preview
        run: ./gradlew :app:assembleLiteRelease -PandmxGithubPreview=true --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testLiteDebugUnitTest --no-daemon --stacktrace

      - name: Compile instrumented smoke tests
        run: ./gradlew :app:assembleLiteDebug :app:assembleLiteDebugAndroidTest -PtestAbi=x86_64 --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Offline Android UI smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedLiteDebugAndroidTest -PtestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.andmx.SmokeTest,com.andmx.DynamicWorkflowRunnerTest --no-daemon --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testLiteDebugUnitTest
            app/build/test-results/testLiteDebugUnitTest
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Delivery policy summary
        if: always()
        run: |
          {
            echo "## Delivery gate"
            echo "- Job: \`build\` (workflow **CI**)"
            echo "- Verifies: lite Kotlin · proot Kotlin · native (CMake/NDK) · unit/Robolectric tests · x86_64 Android smoke tests"
            echo "- Merge only when this job is green on PRs into \`main\`."
            echo "- Issues close via PR body \`Fixes #N\` / \`Closes #N\` on **merge**, not from CI."
            echo "- Do not close the linked Issue while CI is red or only because the PR opened."
          } >> "$GITHUB_STEP_SUMMARY"

  vm:
    name: vm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Read the standalone runtime revision
        id: runtime
        run: |
          revision="$(cat gradle/android-linux-runtime.rev)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: shiaho777/android-linux-runtime
          ref: ${{ steps.runtime.outputs.revision }}
          path: .runtime-ci
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install VM build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;34.0.0" "ndk;27.0.12077973" "ndk;28.2.13676358" "cmake;3.22.1"
          python -m pip install -r .runtime-ci/tools/requirements.txt
      - name: Prepare the verified engine
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          python .runtime-ci/tools/prepare.py
      - name: Build and test the VM variant
        run: |
          ./gradlew :app:testVmDebugUnitTest :app:assembleVmDebug :app:bundleVmRelease \
            "-PandroidLinuxRuntimeDir=$GITHUB_WORKSPACE/.runtime-ci" --no-daemon --stacktrace
      - name: Upload the VM unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vm-unit-test-report
          path: app/build/reports/tests/testVmDebugUnitTest
          retention-days: 7
